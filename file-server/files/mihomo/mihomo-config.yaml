def-for-proxy-provider:
  speedtest: &speedtest
    url: "https://www.gstatic.com/generate_204"
    expected-status: 204
    interval: 86400 # check interval in seconds, set to 0 to disable auto check
    timeout: 5000 # timeout in milliseconds
    tolerance: 30 # only for url-test proxy groups
    lazy: true

  sub-provider-common: &sub-provider-common
    type: http
    header:
      User-Agent:
        - clash.meta
      Accept:
        - "application/yaml,text/yaml,text/plain;q=0.9,*/*;q=0.1"
    health-check:
        enable: true
        <<: *speedtest

proxy-providers:
  ktm:
    <<: *sub-provider-common
    path: ./proxy-providers/ktm.yaml
    url: "http://134.175.54.55:33333/api/v1/client/subscribe?token=41197248aff32b927ce20ec8618eee18"
    interval: 43200
    proxy: DIRECT
    override:
      additional-prefix: "ktm |"
      
  fcm:
    <<: *sub-provider-common
    path: ./proxy-providers/fcm.yaml
    url: "https://api-huacloud.dev/sub?target=clash&insert=true&emoji=true&udp=true&clash.doh=true&new_name=true&filename=Flower_Trojan.yaml&url=https%3A%2F%2Fapi.xmancdn.com%2Fosubscribe.php%3Ftoken2%3Dy3mdempy-f48f474bd2mmrzts5lrf05"
    proxy: DIRECT
    override:
      additional-prefix: "fcm |"
      
  fc:
    <<: *sub-provider-common
    path: ./proxy-providers/fc.yaml
    url: "https://api-huacloud.dev/sub?target=clash&insert=true&emoji=true&udp=true&clash.doh=true&new_name=true&filename=Flower_Trojan.yaml&url=https%3A%2F%2Fapi.xmancdn.com%2Fosubscribe.php%3Ftoken2%3Dqdmnwmry-dc00465fcasgu7sw9orhyy"
    proxy: DIRECT
    override:
      additional-prefix: "fc |"

  one:
    <<: *sub-provider-common
    path: ./proxy-providers/one.yaml
    url: "https://sub1.smallstrawberry.com/api/v1/client/subscribe?token=d133994ffb2255365d1da23d0960525f"

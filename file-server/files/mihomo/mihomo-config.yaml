def-tun-stack: &tun-stack gvisor  # system/gvisor/mixed

def-for-proxy-provider:
  speedtest: &speedtest
    url: "https://www.gstatic.com/generate_204"
    expected-status: 204
    interval: 0 # check interval in seconds, set to 0 to disable auto check
    timeout: 5000 # timeout in milliseconds
    tolerance: 30 # only for url-test proxy groups
    lazy: true

  sub-provider-common: &sub-provider-common
    type: http
    interval: 0 # update time in seconds, set to 0 to disable auto update
    size-limit: 0
    header:
      User-Agent:
        - clash.meta
      Accept:
        - "text/yaml,application/yaml,text/plain,*/*"
    health-check:
        enable: true
        <<: *speedtest

proxy-providers:
  ktm:
    <<: *sub-provider-common
    path: ./proxy-providers/ktm.yaml
    url: "https://ktmcloud001.top/api/v1/client/subscribe?token=41197248aff32b927ce20ec8618eee18"
    proxy: DIRECT
    override:
      additional-prefix: "ktm |"
      
  fcm:
    <<: *sub-provider-common
    path: ./proxy-providers/fcm.yaml
    url: "https://api-huacloud.dev/sub?target=clash&insert=true&emoji=true&udp=true&clash.doh=true&new_name=true&filename=Flower_Trojan.yaml&url=https%3A%2F%2Fapi.xmancdn.com%2Fosubscribe.php%3Ftoken2%3Dy3mdempy-f48f474bd2mmrzts5lrf05"

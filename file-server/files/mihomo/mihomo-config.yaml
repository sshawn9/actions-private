mode: rule
log-level: info # silent, error, warning, info, debug
ipv6: true
find-process-mode: off

mixed-port: 7890

allow-lan: true
bind-address: "*"

tcp-concurrent: true
unified-delay: true
keep-alive-interval: 15
keep-alive-idle: 15
disable-keep-alive: false

external-controller: "0.0.0.0:9090"
secret: "mihomomo"
external-controller-cors:
  allow-origins: ["*"]
  allow-private-network: true
external-doh-server: "/dns-query"

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: 0.0.0.0:1053

  ipv6: false
  use-hosts: true
  use-system-hosts: true

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,connectivity_check,real-ip
    - RULE-SET,private_domain,real-ip
    - RULE-SET,cn_domain,real-ip
    - 'DOMAIN-REGEX,^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$,real-ip'
    - MATCH,fake-ip

  cache-algorithm: arc
  cache-max-size: 4096

  prefer-h3: false
  respect-rules: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "rule-set:private_domain": system
    "rule-set:cn_domain":
      - system
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
    "rule-set:gfw_domain":
      - "https://cloudflare-dns.com/dns-query#RULES"
      - "https://dns.google/dns-query#RULES"
    "rule-set:geolocation-!cn":
      - "https://cloudflare-dns.com/dns-query#RULES"
      - "https://dns.google/dns-query#RULES"
  nameserver:
    - "https://cloudflare-dns.com/dns-query#RULES"
    - "https://dns.google/dns-query#RULES"
  fallback:
    - "https://dns.alidns.com/dns-query#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"
  fallback-lazy-query: false
  fallback-filter:
    geoip: false
    ipcidr: []
    domain: []
  proxy-server-nameserver:
      - https://dns.alidns.com/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
  direct-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  direct-nameserver-follow-policy: true

tun:
  enable: true
  stack: system
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack:
    - any:53
  gso: true
  # include-interface:
  #   - br-lan
  route-exclude-address-set:
    - cn_ip
  route-exclude-address:
    - 0.0.0.0/8
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 192.168.0.0/16
    - 198.19.0.0/16
    - 198.51.100.0/24
    - 203.0.113.0/24
    # - 224.0.0.0/3
    - 224.0.0.0/4
    - ::/127
    - fc00::/7
    - fe80::/10
    # - ff00::/8
    - ff00::/9

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443]

def-common-select: &common-select
  type: select
  proxies:
    - Proxy
    - Vip
    - Cheap
    - DIRECT
    - REJECT
  include-all: true

proxy-groups:
  - name: Proxy
    type: select
    include-all: true
  - name: Vip
    type: select
    include-all: true
  - name: Cheap
    type: select
    include-all: true
  - name: Match
    <<: *common-select
  - name: Shawn
    <<: *common-select
  - name: AI
    <<: *common-select
  - name: Google
    <<: *common-select
  - name: GitHub
    <<: *common-select
  - name: Docker
    <<: *common-select
  - name: YouTube
    <<: *common-select
  - name: Twitter
    <<: *common-select
  - name: Telegram
    <<: *common-select
  - name: Apple
    <<: *common-select

rule-anchor:
  ip: &ip       { type: http, interval: 86400, behavior: ipcidr, format: mrs, proxy: Proxy }
  domain: &domain { type: http, interval: 86400, behavior: domain, format: mrs, proxy: Proxy }

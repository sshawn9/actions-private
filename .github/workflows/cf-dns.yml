name: Terraform Cloudflare DNS

on:
  workflow_dispatch:
    inputs:
      migrate_state:
        description: Copy the committed bootstrap state to R2, then stop
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "cf-dns/**"
      - ".github/workflows/cf-dns.yml"
  push:
    branches: [main]
    paths:
      - "cf-dns/**"
      - ".github/workflows/cf-dns.yml"

permissions:
  contents: read

concurrency:
  group: terraform-cf-dns
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cf-dns

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without remote state
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

  terraform:
    needs: validate
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cf-dns

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Verify required configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          case "$CLOUDFLARE_API_TOKEN" in
            cfat_*) ;;
            *) echo "CLOUDFLARE_API_TOKEN must be an account-owned cfat_ token"; exit 1 ;;
          esac

      - name: Derive account and R2 credentials
        shell: bash
        run: |
          set -euo pipefail

          accounts_response="$(
            curl --fail-with-body --silent --show-error --retry 3 \
              "https://api.cloudflare.com/client/v4/accounts" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          )"
          account_id="$(
            jq -er '
              if .success == true and (.result | length) == 1 then
                .result[0].id | select(test("^[0-9a-f]{32}$"))
              else
                error("cfat_ token must expose exactly one Cloudflare account")
              end
            ' <<<"$accounts_response"
          )"

          token_response="$(
            curl --fail-with-body --silent --show-error --retry 3 \
              "https://api.cloudflare.com/client/v4/accounts/$account_id/tokens/verify" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          )"
          access_key_id="$(
            jq -er '
              if .success == true and .result.status == "active" then
                .result.id | select(test("^[0-9a-f]{32}$"))
              else
                error("cfat_ token is not active")
              end
            ' <<<"$token_response"
          )"
          secret_access_key="$(
            printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1
          )"

          echo "::add-mask::$access_key_id"
          echo "::add-mask::$secret_access_key"
          {
            echo "AWS_ACCESS_KEY_ID=$access_key_id"
            echo "AWS_SECRET_ACCESS_KEY=$secret_access_key"
            echo "AWS_ENDPOINT_URL_S3=https://$account_id.r2.cloudflarestorage.com"
            echo "TF_VAR_account_id=$account_id"
          } >> "$GITHUB_ENV"

      - name: Migrate committed state to R2
        if: github.event_name == 'workflow_dispatch' && inputs.migrate_state
        run: terraform init -input=false -migrate-state -force-copy

      - name: Verify migrated remote state
        if: github.event_name == 'workflow_dispatch' && inputs.migrate_state
        run: terraform state list

      - name: Require the one-time state migration
        if: github.event_name != 'workflow_dispatch' || !inputs.migrate_state
        run: |
          if test -f terraform.tfstate; then
            echo "Run this workflow manually with migrate_state=true, verify the R2 state, then remove cf-dns/terraform.tfstate."
            exit 1
          fi

      - name: Initialize remote state
        if: github.event_name != 'workflow_dispatch' || !inputs.migrate_state
        run: terraform init -input=false

      - name: Plan
        if: github.event_name != 'workflow_dispatch' || !inputs.migrate_state
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || !inputs.migrate_state)
        run: terraform apply -input=false -auto-approve tfplan

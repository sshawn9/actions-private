name = "rendercv-github-auth"
main = "../source/workers/github-auth/src/index.ts"
compatibility_date = "2026-10-23"
workers_dev = false
preview_urls = false

# Deploy the source revision used by the website; do not copy Worker code here.
# Wrangler owns this domain and its DNS record; do not duplicate it in cf-dns.
routes = [{ pattern = "rendercv-auth.sshawn9.com", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://rendercv.sshawn9.com"
# CI supplies GITHUB_OAUTH_CLIENT_ID via --var, and the client secret via --secrets-file.

[observability]
enabled = false
